name: Release

on:
  push:
    tags: ["v*"]
  # a test build without a release: the packages are kept as workflow artifacts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agents:
    name: Linux agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3 (aarch64 builds run under emulation)
      - name: Build static agents (musl, Docker)
        run: scripts/build-agents.sh aarch64 x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agents
          path: agents/
          if-no-files-found: error

  macos:
    name: macOS arm64 app
    needs: agents
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agents
          path: agents/
      - name: Agent permissions (artifacts drop the executable bit)
        run: chmod +x agents/linux-*/commitkiwi-agent

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: brew install cmake
      - run: cargo fetch --locked # scripts/gen-third-party.py reads every platform's crate sources offline
      - run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Build, bundle licences, verify the signature
        run: scripts/package-macos.sh
        env: # signs the in-app update bundle (.app.tar.gz + .sig)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} app
    needs: agents
    strategy:
      matrix:
        include:
          # the oldest supported Ubuntu: AppImage and .deb then run on distributions with glibc 2.35 or newer
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agents
          path: agents/
      - name: Agent permissions (artifacts drop the executable bit)
        run: chmod +x agents/linux-*/commitkiwi-agent
      - name: System packages (Tauri on Linux, llama.cpp build, AppImage and rpm bundling)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev cmake clang file rpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: cargo fetch --locked # scripts/gen-third-party.py reads every platform's crate sources offline
      - run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Build AppImage, .deb and .rpm, check the bundled licences and agents
        run: scripts/package-linux.sh
        env: # signs the AppImage for in-app updates (.AppImage.sig)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # build provenance (actions/attest-build-provenance wraps actions/attest)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: built/ # every artifact in its own folder; the agents are left out by the file names below

      - name: Collect release files and checksums
        run: |
          mkdir release
          find built -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.AppImage.sig' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release/ \;
          # the macOS update bundle is named commit.kiwi.app.tar.gz: give it the version and arch like the rest
          # (artifacts keep paths below the common folder: built/macos/macos/...)
          for f in $(find built/macos -type f \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \)); do
            cp "$f" "release/commit.kiwi_${GITHUB_REF_NAME#v}_aarch64.app.tar.gz${f##*.app.tar.gz}"
          done
          scripts/updater-manifest.sh release "$GITHUB_REF_NAME" "${{ github.repository }}"
          scripts/release-checksums.sh release

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/*.dmg
            release/*.app.tar.gz
            release/*.AppImage
            release/*.deb
            release/*.rpm

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --repo "${{ github.repository }}" --title "commit.kiwi ${GITHUB_REF_NAME#v}" \
            --notes "Draft: add the release notes (see docs/RELEASING.md)."
