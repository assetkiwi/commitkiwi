name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: System packages (Tauri on Linux, llama.cpp build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev cmake clang

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: UI install, types, unit tests, build (the Tauri crate embeds app/dist)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build

      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Third-party licences are current
        run: |
          cargo fetch --locked # every platform's crates: the script reads licence files offline
          python3 scripts/gen-third-party.py --check

      # Browser end-to-end tests: they need Chrome and the dev server (`pnpm dev` on 127.0.0.1:1420) running in the
      # background. Optional; enable when the runner setup is settled.
      # - name: e2e
      #   working-directory: app
      #   run: |
      #     (pnpm dev &) && npx wait-on http://127.0.0.1:1420
      #     pnpm e2e
