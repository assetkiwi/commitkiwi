[package]
name = "commitkiwi-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
commitkiwi-protocol = { version = "0.1.0", path = "../../crates/protocol" }
commitkiwi-runner = { version = "0.1.0", path = "../../crates/runner" }
commitkiwi-llm = { version = "0.1.0", path = "../../crates/llm" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
libc = "0.2"
tokio = { version = "1.54.1", features = ["sync", "time"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[dev-dependencies]
tempfile = "3.27.0"
